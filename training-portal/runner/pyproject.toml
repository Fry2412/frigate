[build-system]
requires = ["setuptools>=69,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-runner"
version = "0.1.0"
description = "GPU worker for the Frigate training portal POC"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "Pillow==13.0.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
portal-runner = "portal_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
