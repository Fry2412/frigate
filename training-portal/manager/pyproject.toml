[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-manager"
version = "0.1.0"
description = "Reviewable image and training job manager for the Frigate training portal POC"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.161.1",
  "uvicorn==0.54.0",
  "Pillow==13.0.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["portal_manager*"]

[tool.setuptools.package-data]
portal_manager = ["static/*"]
