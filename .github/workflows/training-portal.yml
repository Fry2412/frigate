name: Training portal POC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'training-portal/**'
      - 'frigate/**'
      - '.github/workflows/training-portal.yml'
  push:
    branches: [main, 'codex/training-portal-poc', 'feat/**']
    paths:
      - 'training-portal/**'
      - 'frigate/**'
      - 'web/**'
      - 'docker/**'
      - '.github/workflows/training-portal.yml'

concurrency:
  group: training-portal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install POC test dependencies
        run: python -m pip install -e './training-portal/manager[test]' -e './training-portal/runner[test]' ruff==0.17.2
      - name: Lint POC
        run: |
          ruff check training-portal/manager training-portal/runner training-portal/tests
          ruff format --check training-portal/manager training-portal/runner training-portal/tests
      - name: Check browser modules
        run: |
          node --input-type=module --check < training-portal/manager/portal_manager/static/app.js
          node --input-type=module --check < training-portal/manager/portal_manager/static/studio.js
      - name: Test POC services
        run: python -m pytest training-portal/manager/tests training-portal/runner/tests training-portal/tests -q

  images:
    needs: [test, frigate-integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: manager
            context: training-portal/manager
            dockerfile: training-portal/manager/Dockerfile
            target: ''
          - package: runner
            context: training-portal/runner
            dockerfile: training-portal/runner/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Make room for CUDA image
        if: matrix.package == 'runner'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PACKAGE: ${{ matrix.package }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/training-${PACKAGE}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish POC image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=training-${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=training-${{ matrix.package }}

  frigate-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build focused Frigate Linux test environment
        run: docker build -t portal-frigate-tests training-portal/ci/frigate-test
      - name: Verify opt-in configuration, routing and Plus compatibility
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/labelmap.txt:/labelmap.txt:ro" \
            -v "$PWD/audio-labelmap.txt:/audio-labelmap.txt:ro" \
            portal-frigate-tests python -m pytest -q \
            frigate/test/test_model_trainer.py \
            frigate/test/test_model_trainer_config.py \
            frigate/test/test_plus_startup.py \
            frigate/test/http_api/test_http_app.py \
            frigate/test/http_api/test_http_event.py
