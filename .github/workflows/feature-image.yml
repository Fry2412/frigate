name: Fork image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
      - "codex/training-portal-poc"
    paths-ignore:
      - "training-portal/**"
      - ".github/workflows/training-portal.yml"

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish fork image
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU and Buildx
        uses: ./.github/actions/setup
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: lowercaseRepo
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      - name: Create image tags
        id: metadata
        shell: bash
        env:
          IMAGE: ghcr.io/${{ steps.lowercaseRepo.outputs.lowercase }}
        run: |
          prefix=feature
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            prefix=main
          fi

          {
            echo "tags<<EOF"
            echo "${IMAGE}:${prefix}-${GITHUB_SHA::7}"
            if [[ "$prefix" == "main" ]]; then
              echo "${IMAGE}:main"
            fi
            echo "EOF"
            echo "cache=${IMAGE}:${prefix}-cache"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push default fork image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/main/Dockerfile
          target: frigate
          push: true
          # Fork builds target the runner's default architecture. Frigate's
          # release pipeline remains responsible for multi-architecture images.
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.metadata.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.metadata.outputs.cache }},mode=max
