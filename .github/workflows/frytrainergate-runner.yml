name: FryTrainerGate Runner image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - "feat/**"
    paths:
      - "frytrainergate/runner/**"
      - "frytrainergate/shared/**"
      - ".github/workflows/frytrainergate-runner.yml"

permissions:
  contents: read
  packages: write

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create safe branch tag
        id: metadata
        shell: bash
        run: |
          branch_tag="branch-$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')"
          echo "branch_tag=$branch_tag" >> "$GITHUB_OUTPUT"
      - name: Build and publish Runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frytrainergate/runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/fry2412/frigate-frytrainergate-runner:sha-${{ github.sha }}
            ghcr.io/fry2412/frigate-frytrainergate-runner:feature-${{ github.sha }}
            ghcr.io/fry2412/frigate-frytrainergate-runner:${{ steps.metadata.outputs.branch_tag }}
          cache-from: type=registry,ref=ghcr.io/fry2412/frigate-frytrainergate-runner:buildcache
          cache-to: type=registry,ref=ghcr.io/fry2412/frigate-frytrainergate-runner:buildcache,mode=max
